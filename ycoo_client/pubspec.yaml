name: ycoo_client
description: "源论坛 ycoo.net 多端客户端"
publish_to: 'none'
version: 1.1.1+22

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  html: ^0.15.4
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  # 锁 1.7.0：保持既有动态取色行为，升级需单独回归主题
  dynamic_color: 1.7.0
  # 0.10+ 改用 Flutter v2 embedding，旧版 0.5.2 在 Flutter 3.41 上无法编译
  workmanager: ^0.10.10
  # 应用内更新：校验 Release 提供的 APK SHA-256
  crypto: ^3.0.7
  # 液态玻璃 UI（底栏 + 回帖栏）：iOS 26 Liquid Glass 风格，Impeller 走 Shader、Skia/Web 自动降级
  liquid_glass_widgets: ^1.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
