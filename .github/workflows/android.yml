name: Android APK

on:
  push:
    branches: [main]
    # 打 tag（v1.0.10 这种）时构建并发布到 Release
    tags: ['v*']
  pull_request:
    paths:
      - 'ycoo_client/**'
  workflow_dispatch:

permissions:
  contents: write # 发布 Release 需要写权限

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ycoo_client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Versions
        run: |
          flutter --version
          java -version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      # 只跑离线测试：live_image_test 依赖线上图片，CI 里不稳定
      - name: Offline tests
        run: flutter test test/paid_thread_test.dart test/link_resolver_test.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Name APK by pubspec version
        id: apk
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cd build/app/outputs/flutter-apk
          ls -lh
          cp app-release.apk "ycoo-client-${VERSION}.apk"

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ycoo-client-apk
          path: ycoo_client/build/app/outputs/flutter-apk/ycoo-client-*.apk
          if-no-files-found: error
          retention-days: 30

      # 仅在 tag 触发时发布，避免每次 main 提交都产生 Release
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ycoo_client/build/app/outputs/flutter-apk/ycoo-client-*.apk
          name: ${{ github.ref_name }} — 源论坛客户端
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 安装包

            - `ycoo-client-${{ steps.apk.outputs.version }}.apk`（Android，minSdk 21）
            - 支持 ABI：arm64-v8a / armeabi-v7a / x86 / x86_64
            - 使用 debug 签名，仅供测试
