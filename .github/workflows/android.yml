name: Android APK

on:
  push:
    branches: [main]
    # 打 tag（v1.0.10 这种）时构建并发布到 Release
    tags: ['v*']
  pull_request:
    paths:
      - 'ycoo_client/**'
  workflow_dispatch:

permissions:
  contents: write # 发布 Release 需要写权限

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    # 签名密钥保存在 default 环境的 Secrets 中
    environment: default
    defaults:
      run:
        working-directory: ycoo_client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Versions
        run: |
          flutter --version
          java -version

      # Flutter 3.41.9 的 Gradle 插件源码在 AGP 8.11.1 下无法直接编译/打包，
      # 构建前统一打补丁（见脚本内注释）。
      - name: Patch Flutter Gradle plugin
        run: bash tool/patch_flutter_gradle_plugin.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      # 只跑离线测试：live_image_test 依赖线上图片，CI 里不稳定
      - name: Offline tests
        run: flutter test test/paid_thread_test.dart test/link_resolver_test.dart test/new_thread_test.dart test/post_filter_test.dart test/hidden_thread_test.dart test/update_manifest_test.dart test/update_service_test.dart test/update_page_test.dart test/thread_actions_test.dart test/glass_reply_bar_test.dart test/reply_composer_test.dart

      # 正式签名：密钥与口令存放在仓库 Secrets，绝不入库。
      # 缺少 Secret 时退回 debug 签名，仅用于本地/预发布验证。
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 未配置，本次使用 debug 签名"
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.keystore"
          } > android/key.properties
          echo "已写入 release 签名配置"

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Verify APK signatures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            [ -f "$apk" ] || continue
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Name APKs by pubspec version and ABI
        id: apk
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cd build/app/outputs/flutter-apk
          ls -lh
          for apk in app-*-release.apk; do
            [ -f "$apk" ] || continue
            abi="${apk#app-}"
            abi="${abi%-release.apk}"
            cp "$apk" "ycoo-client-${VERSION}-${abi}.apk"
          done

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ycoo-client-apks
          path: ycoo_client/build/app/outputs/flutter-apk/ycoo-client-*.apk
          if-no-files-found: error
          retention-days: 30

      # 随 Release 上传 latest.json，供 App 内更新读取版本 / APK / 校验值
      # 每个 ABI 一个独立 APK，manifest 内含 apks 数组，App 按当前 ABI 选择
      - name: Generate update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${{ steps.apk.outputs.version }}"
          APK_DIR="$GITHUB_WORKSPACE/ycoo_client/build/app/outputs/flutter-apk"
          OUT="$GITHUB_WORKSPACE/ycoo_client/latest.json"
          shopt -s nullglob
          APKS=("$APK_DIR"/ycoo-client-${VERSION}-*.apk)
          shopt -u nullglob
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::未找到 ycoo-client-${VERSION}-*.apk"
            echo "pwd=$(pwd)"
            echo "APK_DIR=$APK_DIR"
            echo "VERSION=$VERSION"
            ls -la "$APK_DIR" || true
            exit 1
          fi
          # 每个 abi/size/sha 作为独立 argv 传给 Python；
          # 此前拼成单个 "$PY_ARGS" 字符串，Python 只收到一个参数导致 apks 恒为空
          PY_ARGS=("$VERSION" "$OUT")
          for apk in "${APKS[@]}"; do
            base="$(basename "$apk")"
            abi="${base#ycoo-client-${VERSION}-}"
            abi="${abi%.apk}"
            size="$(stat -c%s "$apk")"
            sha="$(sha256sum "$apk" | awk '{print $1}')"
            PY_ARGS+=("$abi" "$size" "$sha")
          done
          python3 - "${PY_ARGS[@]}" <<'PY'
          import json
          import sys

          args = sys.argv[1:]
          version = args[0]
          out_path = args[1]
          tag = f"v{version}"
          apks = []
          for i in range(2, len(args), 3):
              abi, size, sha = args[i], args[i + 1], args[i + 2]
              apks.append({
                  "abi": abi,
                  "url": (
                      f"https://github.com/Mulidesi/ycoo/releases/download/"
                      f"{tag}/ycoo-client-{version}-{abi}.apk"
                  ),
                  "size": int(size),
                  "sha256": sha,
              })

          notes = (
              "## 安装包\n\n"
              f"- `ycoo-client-{version}.apk`（Android，minSdk 24）\n"
              "- 支持 ABI：arm64-v8a / armeabi-v7a / x86_64\n"
              "- 使用固定 release 签名，可直接覆盖安装后续版本"
          )

          arm64 = next((a for a in apks if a["abi"] == "arm64-v8a"), apks[0])
          manifest = {
              "version": version,
              "tag": tag,
              "apk_url": arm64["url"],
              "size": arm64["size"],
              "sha256": arm64["sha256"],
              "apks": apks,
              "notes": notes,
          }
          with open(out_path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PY
          cat "$OUT"

      # 仅在 tag 触发时发布，避免每次 main 提交都产生 Release
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ycoo_client/build/app/outputs/flutter-apk/ycoo-client-*.apk
            ycoo_client/latest.json
          name: ${{ github.ref_name }} — 源论坛客户端
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 安装包

            - `ycoo-client-${{ steps.apk.outputs.version }}-arm64-v8a.apk`（arm64 设备）
            - `ycoo-client-${{ steps.apk.outputs.version }}-armeabi-v7a.apk`（32 位 ARM 设备）
            - `ycoo-client-${{ steps.apk.outputs.version }}-x86_64.apk`（x86_64 模拟器/平板）
            - minSdk 24，使用固定 release 签名，可直接覆盖安装后续版本
