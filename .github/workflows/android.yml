name: Android APK

on:
  push:
    branches: [main]
    # 打 tag（v1.0.10 这种）时构建并发布到 Release
    tags: ['v*']
  pull_request:
    paths:
      - 'ycoo_client/**'
  workflow_dispatch:

permissions:
  contents: write # 发布 Release 需要写权限

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    # 签名密钥保存在 default 环境的 Secrets 中
    environment: default
    defaults:
      run:
        working-directory: ycoo_client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Versions
        run: |
          flutter --version
          java -version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      # 只跑离线测试：live_image_test 依赖线上图片，CI 里不稳定
      - name: Offline tests
        run: flutter test test/paid_thread_test.dart test/link_resolver_test.dart

      # 正式签名：密钥与口令存放在仓库 Secrets，绝不入库。
      # 缺少 Secret 时退回 debug 签名，仅用于本地/预发布验证。
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 未配置，本次使用 debug 签名"
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.keystore"
          } > android/key.properties
          echo "已写入 release 签名配置"

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Name APK by pubspec version
        id: apk
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cd build/app/outputs/flutter-apk
          ls -lh
          cp app-release.apk "ycoo-client-${VERSION}.apk"

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ycoo-client-apk
          path: ycoo_client/build/app/outputs/flutter-apk/ycoo-client-*.apk
          if-no-files-found: error
          retention-days: 30

      # 仅在 tag 触发时发布，避免每次 main 提交都产生 Release
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ycoo_client/build/app/outputs/flutter-apk/ycoo-client-*.apk
          name: ${{ github.ref_name }} — 源论坛客户端
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 安装包

            - `ycoo-client-${{ steps.apk.outputs.version }}.apk`（Android，minSdk 21）
            - 支持 ABI：arm64-v8a / armeabi-v7a / x86 / x86_64
            - 使用固定 release 签名，可直接覆盖安装后续版本
